# このプロジェクトはこれまでSupabase CLIを初期化していなかった
# （supabase/schema.sqlはSQL Editorへ直接貼り付けて運用する方式のため）。
# このファイルは、Edge Function（ocr-receipt）をデプロイする際に
# 「Authorizationヘッダーの検証（verify_jwt）を有効にする」という設定を、
# CLIの暗黙のデフォルトに任せず明示するためだけに追加した最小限のファイルである。
#
# project_id は `npx supabase link --project-ref <あなたのプロジェクトref>`
# を実行すると、このファイルへ自動的に書き込まれる（Supabaseダッシュボード→
# Project Settings→General→Reference IDでも確認できる）。それまでは
# プレースホルダーのままで構わない（`supabase functions deploy` 自体は
# `--project-ref` フラグを渡せばこの値が無くても実行できるが、`link`する方が
# 以後のCLI操作全般で確実なため推奨する）。
project_id = "your-project-ref"

# ocr-receipt：Supabaseプラットフォーム自体にAuthorizationヘッダー
# （呼び出し元ユーザーのJWT）の検証をさせる。これはこのプロジェクトの
# フロントが新しいpublishable key（sb_publishable_...、JWTではない不透明な
# トークン）を使っていても関係なく機能する（publishable/secret keyそのものを
# Authorizationとして渡された場合は、JWTとして解釈できずここで拒否される）。
#
# 重要：手元のSupabase CLI（`supabase functions new`でのscaffold結果）で
# 確認したところ、新規に生成されるconfig.tomlのfunctionsセクションは
# `verify_jwt = false` になっていた。つまり現行のCLIでは、config.tomlで
# 明示しない場合の実質的なデフォルトはtrueとは限らない（true前提の思い込みは
# 危険）。関数内部（index.ts）でも auth.getUser() による独立した二重チェックを
# 行っているため、これを無効化しても最終的な安全性は失われない設計だが、
# 「暗黙のデフォルトに依存しない・trueであることを保証する」ため、
# ここで明示的にtrueとしている。
[functions.ocr-receipt]
verify_jwt = true

# create-concur-quick-expense：現時点ではConcur APIへの実通信・認証情報の
# 取り扱いを一切行わない、スタブ応答のみのEdge Functionだが、Supabase
# ユーザー認証はocr-receiptと同様に最初から必須にしている（実データを扱う
# ようになってから追加するのではなく、公開時点から認証なしでは呼び出せない
# 状態にするため）。
#
# ocr-receiptと同じ理由でtrueを明示する：関数内部（index.ts・
# resolveQuickExpenseAuthorization.js）でもauth.getUser()による独立した
# 二重チェックを行っているため、これを無効化しても最終的な安全性は失われない
# 設計だが、暗黙のデフォルト（現行のSupabase CLIのscaffold結果はfalse）に
# 依存しない・trueであることを保証するため、ここで明示的にtrueとしている。
#
# 既存のフロント（src/data/concurApi.jsのcreateQuickExpense()）は、呼び出し前に
# ensureValidSession()でセッションを確認したうえでsupabase.functions.invoke()を
# 使っており、ログイン中セッションのアクセストークンが自動的にAuthorization
# ヘッダーへ付与される（ocrReceiptRepository.js・ocr-receiptと同じ仕組み）ため、
# verify_jwt = true にしても既存の呼び出し方式との不整合は無い。
[functions.create-concur-quick-expense]
verify_jwt = true

# check-concur-oauth：Concur OAuth（Refresh Token Grant）の疎通確認だけを行う、
# platform_admin専用のFunction。既存の「Concurに登録」ボタン・
# create-concur-quick-expenseとは未接続で、通常はCONCUR_OAUTH_CHECK_ENABLED
# （Secret、厳密に"true"の場合のみ有効）が未設定のため、実際には何も
# 通信しない安全な状態のまま追加している（このコミット時点ではdeployしていない）。
# 他のEdge Functionと同じ理由でverify_jwtを明示的にtrueとする：関数内部
# （index.ts・resolveConcurOAuthCheckAuthorization.js）でもauth.getUser()に
# よる独立した二重チェック・is_platform_admin()によるサーバー側の権限確認を
# 行っているため、これを無効化しても最終的な安全性は失われない設計だが、
# 暗黙のデフォルトに依存しない・trueであることを保証するため明示している。
[functions.check-concur-oauth]
verify_jwt = true

# lookup-concur-user：Concur Identity API（GET /profile/identity/v4/Users）で
# 指定されたConcurログインID（userName）に対応する利用者を検索する、
# platform_admin専用のFunction。check-concur-oauthと同じOAuth＋Vaultの
# 仕組みを再利用するが、安全ゲートは別のSecret（CONCUR_IDENTITY_LOOKUP_ENABLED、
# 厳密に"true"の場合のみ有効）で独立に管理する（このコミット時点では未設定の
# ため、実際には何も通信しない安全な状態のまま追加している。deployしていない）。
# 他のEdge Functionと同じ理由でverify_jwtを明示的にtrueとする：関数内部
# （index.ts・resolveLookupConcurUserAuthorization.js）でもauth.getUser()に
# よる独立した二重チェック・is_platform_admin()によるサーバー側の権限確認を
# 行っているため、これを無効化しても最終的な安全性は失われない設計だが、
# 暗黙のデフォルトに依存しない・trueであることを保証するため明示している。
[functions.lookup-concur-user]
verify_jwt = true

# link-concur-user：一般利用者（company_membersに所属する本人）が自分自身の
# ConcurログインIDを、Identity APIで実在確認したうえでuser_id×company_id単位で
# 保存する（Phase 13）Function。lookup-concur-userとは異なりplatform_admin限定
# ではないが、is_platform_admin()は使わずresolve_concur_oauth_company_id
# （company_membersへの実際の所属確認）だけで権限判定する。安全ゲートは
# 別のSecret（CONCUR_USER_LINK_ENABLED、厳密に"true"の場合のみ有効）で独立に
# 管理する（このコミット時点では未設定のため、実際には何も通信・保存しない
# 安全な状態のまま追加している。deployしていない）。
# 他のEdge Functionと同じ理由でverify_jwtを明示的にtrueとする：関数内部
# （index.ts・resolveLinkConcurUserAuthorization.js）でもauth.getUser()に
# よる独立した二重チェックを行っているため、これを無効化しても最終的な
# 安全性は失われない設計だが、暗黙のデフォルトに依存しない・trueであることを
# 保証するため明示している。
[functions.link-concur-user]
verify_jwt = true
